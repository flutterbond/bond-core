name: example
description: Bond project.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Bond packages (resolved to the workspace members)
  bond_core: ^0.1.0
  bond_form: ^0.1.0
  bond_form_riverpod: ^0.1.0

  get_it: ">=8.0.3 <10.0.0"

  # navigation packages
  go_router: ^18.0.2

  # state management
  flutter_riverpod: ^3.4.3

  # localization
  intl: ^0.20.2

  # Material Design library (decoupled from the Flutter SDK)
  material_ui: ^1.6.0

  stack_trace: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/
