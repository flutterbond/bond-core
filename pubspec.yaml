name: bond_core_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/core
  - packages/cache
  - packages/network
  - packages/form
  - packages/form/packages/bond_form_getx
  - packages/form/packages/bond_form_bloc
  - packages/notifications
  - packages/app_analytics
  - packages/form/packages/bond_form_riverpod
  - packages/form/packages/bond_form_riverpod/example

dev_dependencies:
  flutter_lints: ^6.0.0
  melos: ^8.9.0

# lib/ and test/ are passed explicitly so that a package never re-checks the
# packages nested inside it (packages/form contains the bond_form_* adapters).
melos:
  scripts:
    analyze:
      description: Analyze every package.
      exec: dart analyze --fatal-infos \$(ls -d lib test 2>/dev/null)

    format:
      description: Check formatting of every package (fails if a file would change).
      exec: dart format --output=none --set-exit-if-changed \$(ls -d lib test 2>/dev/null)

    test:
      description: Run the tests of every package that has a test/ directory.
      exec:
        command: flutter test
        concurrency: 1
      packageFilters:
        dirExists: test

    fix:test:
      description: Check the data-driven fixes (lib/fix_data.yaml) against their golden files.
      exec: dart fix --compare-to-golden test_fixes
      packageFilters:
        dirExists: test_fixes

    publish:dry:
      description: Validate every publishable package with a publish dry run.
      exec:
        command: dart pub publish --dry-run
        concurrency: 1
      packageFilters:
        noPrivate: true
